<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Chevauchoir - En Direct</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #090909, #202020);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    background: #151515;
    border: 1px solid #333333;
    border-radius: 25px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.55);
}

.radio-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.subtitle {
    margin-top: 10px;
    font-size: 18px;
    color: #dddddd;
}

.location {
    margin-top: 8px;
    font-size: 14px;
    color: #999999;
}

.live {
    display: inline-block;
    margin-top: 25px;
    padding: 8px 18px;
    border-radius: 20px;
    background: #b00000;
    font-weight: bold;
}

.play {
    width: 110px;
    height: 110px;
    margin: 30px auto 20px;
    border: none;
    border-radius: 50%;
    background: #d00000;
    color: #ffffff;
    font-size: 45px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.45);
}

.play:active {
    transform: scale(0.96);
}

.status {
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
}

.info {
    margin-top: 20px;
    padding: 15px;
    background: #222222;
    border-radius: 12px;
    color: #bbbbbb;
    font-size: 14px;
    line-height: 1.5;
}

.official {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 22px;
    background: #333333;
    color: #ffffff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    color: #777777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="radio-icon">📻</div>

    <h1>Radio Chevauchoir</h1>

    <div class="subtitle">
        La radio proche de vous !
    </div>

    <div class="location">
        Lesve • Province de Namur • Belgique
    </div>

    <div class="live">
        🔴 EN DIRECT
    </div>

    <button id="playButton" class="play" type="button">
        ▶
    </button>

    <div id="status" class="status">
        PRÊT À ÉCOUTER
    </div>

    <div class="info">
        🎵 Cliquez sur le bouton pour écouter Radio Chevauchoir en direct.
    </div>

    <audio id="radioPlayer" preload="none">
        <source src="https://radio10.pro-fhi.net/flux-nqjpklks/stream" type="audio/mpeg">
    </audio>

    <a
        class="official"
        href="https://www.radiochevauchoir.be/"
        target="_blank"
        rel="noopener noreferrer">
        🌐 SITE OFFICIEL
    </a>

    <div class="footer">
        Radio Chevauchoir • Écoute en direct
    </div>

</div>

<script>
const player = document.getElementById("radioPlayer");
const button = document.getElementById("playButton");
const status = document.getElementById("status");

button.addEventListener("click", async function() {

    if (player.paused) {

        status.textContent = "⏳ CONNEXION EN COURS...";
        button.textContent = "⏳";

        try {

            await player.play();

            button.textContent = "⏸";
            status.textContent = "🔴 ÉCOUTE EN DIRECT";

        } catch (error) {

            button.textContent = "▶";
            status.textContent = "⚠️ FLUX NON DISPONIBLE";

            alert(
                "Le flux ne peut pas être lu directement depuis cette page. " +
                "Appuyez sur SITE OFFICIEL pour écouter la radio."
            );
        }

    } else {

        player.pause();

        button.textContent = "▶";
        status.textContent = "⏸ ÉCOUTE EN PAUSE";
    }
});

player.addEventListener("playing", function() {
    button.textContent = "⏸";
    status.textContent = "🔴 ÉCOUTE EN DIRECT";
});

player.addEventListener("error", function() {
    button.textContent = "▶";
    status.textContent = "⚠️ FLUX NON DISPONIBLE";
});
</script>

</body>
</html>
